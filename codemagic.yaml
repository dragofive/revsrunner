# custom-ios-runner
#
# Codemagic clones THIS repo for every Custom Builds iOS job. Unlike the
# constructor's ios-template (a fixed Capacitor WebView shell), this runner
# builds the USER's OWN project: the RevsApp backend fires POST /builds with a
# workflowId and an environment.variables payload carrying
#
#   * REVS_SOURCE_URL      - presigned GET for the user's uploaded project ZIP
#   * REVS_PROJECT_TYPE    - flutter | react_native | expo | capacitor | ios
#   * REVS_BUILD_CONFIG    - JSON detection markers (root path, etc.)
#   * REVS_PUBLISH_TARGET  - none | tf_internal | testflight (for logging/notify)
#   * APP_STORE_CONNECT_*  - the tenant's .p8 + key id + issuer id (signing)
#   * CERTIFICATE_PRIVATE_KEY - the project's PERSISTENT distribution private
#                            key, generated and stored once by the backend.
#                            scripts/sign.sh REFUSES to run without it (no
#                            fallback key generation) because generating one per
#                            build is what made Apple mint a certificate per
#                            build. Codemagic does NOT mask POST /builds
#                            variables, so this value must only ever be
#                            referenced as @env:CERTIFICATE_PRIVATE_KEY and
#                            never echoed.
#   * BUNDLE_ID / TEAM_ID  - the tenant's Apple identity
#   * REVS_BACKEND_URL / REVS_WEBHOOK_TOKEN / REVS_BUILD_ID - the callback
#
# Nothing tenant-specific is committed here; every input arrives per-build as an
# env-var, so one runner repo serves every user. Signing is autopilot WITHOUT
# revoking the user's existing certificates (REVS_NO_REVOKE=1).
#
# THREE workflows share the exact same build+sign steps (via YAML anchors):
#   * custom-ios                     - build a signed .ipa and hand it back (no upload)
#   * custom-ios-testflight-internal - same build, upload only, no beta review
#   * custom-ios-testflight          - same build, then upload + submit to TestFlight
# The backend picks the workflow by publish_target. Uploading/submitting is done
# by Codemagic's built-in `publishing.app_store_connect` block (NOT the CLI we
# call in scripts, which is only for signing). Precondition for both TestFlight
# variants: the App Store Connect app record with this Bundle ID must already exist.
#
# A third workflow, custom-ios-appstore (submit_to_app_store), was REMOVED:
# App Store review submission is no longer offered as a Custom Builds publish
# target, because a submission also needs version metadata (screenshots,
# description, export compliance, age rating) that only the tenant can supply in
# App Store Connect. Tenants ship to TestFlight from here and promote the build
# to a store release by hand. Do NOT re-add it without re-adding the backend
# workflow id and the UI option; the backend now rejects publish_target=appstore
# at the schema, so this file alone cannot bring the feature back.
#
# DEPLOY ORDER DEPENDS ON THE DIRECTION OF THE CHANGE. The rule below is for
# REMOVING or RENAMING a workflow (and for the CERTIFICATE_PRIVATE_KEY rollout
# it was written for). ADDING a workflow is the exact opposite: RUNNER FIRST,
# BACKEND SECOND. By the same mechanism this block describes, a backend that
# dispatches a workflow id which is not yet in the cloned yaml kills the job
# before any script runs, so notify-backend.sh never fires and the CustomBuild
# row sits in 'building' holding a concurrency slot until the sweeper. Pushing
# a new workflow first is harmless: nothing dispatches it yet. See the "Порядок
# деплоя" section of README.md for the reasoning in full.
#
# DEPLOY ORDER (REMOVAL/RENAME): BACKEND IMAGE FIRST, THEN PUSH THIS REPO TO revsrunner.
# Pushing the runner first breaks iOS builds in two ways, and one of them is
# silent. (1) An old backend does not send CERTIFICATE_PRIVATE_KEY, so every job
# stops at the sanity check. (2) An old backend still dispatches
# publish_target=appstore to the workflow id 'custom-ios-appstore', which no
# longer exists here: Codemagic resolves workflows from the CLONED yaml, so the
# job dies before any script runs, notify-backend.sh (which lives in that
# deleted workflow's publishing block) never fires, and the CustomBuild row sits
# in 'building', holding a concurrency slot, until the backend's timeout sweeper
# fails it with the wrong reason. The push is a one-liner and the backend needs
# an image rebuild, so the wrong order is the convenient one. Do not take it.

definitions:
  environment: &custom_ios_env
    # Xcode is PINNED here too, and the blast radius of NOT pinning is bigger
    # here than in the constructor. Read this before changing it.
    #
    # WHY PINNED RATHER THAN "latest". This runner compiles the TENANT'S OWN
    # arbitrary project (scripts/build.sh drives flutter / react_native /
    # expo / capacitor / plain ios), which is precisely the code we cannot fix
    # when the toolchain moves under it. On "latest", a single provider-side
    # image flip breaks an unknown subset of tenants at once, in code we have
    # neither the right nor the ability to patch, and the only recovery is a
    # push to this repo. The nastiest case is not even a red build: Apple
    # requires the UIScene lifecycle for any UIKit app BUILT WITH the iOS 27
    # SDK, and a tenant project that has not adopted it still compiles, signs,
    # uploads and passes Apple's processing, then dies at launch with "UIScene
    # life cycle is required for apps built with this SDK" (Apple TN3187).
    # Every build green, every app unopenable, no CI signal anywhere.
    #
    # WHY 26.6, AND WHY THE SAME NUMBER AS THE CONSTRUCTOR. 26.6 is the only
    # image validated by a real signed build that reached TestFlight:
    # Xcode-26.6.app (17F113) on macOS 26.5.1 (build 25F80), 2026-09-23.
    # Keeping both repos on the SAME image means one deprecation clock instead
    # of two, and no "works in the constructor, fails here" signing divergence
    # on top of a scripts/sign.sh that is deliberately byte-identical between
    # them. One number to bump, one number to test. Never use "edge": it is
    # allowed to be a beta and is 27.0 today.
    #
    # THIS IS A MINOR PIN, NOT AN EXACT ONE. A patch-precise value is
    # auto-resolved to the latest patch of that minor, and only one patch per
    # minor is kept on the images, so the patch level floats regardless. Fine:
    # the hazards being frozen out all live at the major boundary.
    #
    # WHAT WOULD FORCE A BUMP.
    #   1. HARD DEADLINE, around April 2027: App Store Connect stops accepting
    #      uploads not built with the iOS 27 SDK or later.
    #   2. Deprecation of the 26.6 image. On mac_mini_m2 an unsupported xcode
    #      value means builds DO NOT START AT ALL: no script runs, so
    #      publishing -> notify-backend.sh never fires and the CustomBuild row
    #      strands in 'building' holding a concurrency slot until the timeout
    #      sweeper fails it with the wrong reason. Exactly the same silent
    #      shape as the deploy-order hazard described in the header above.
    #      Precedent is roughly one month of notice, on a channel nobody here
    #      currently watches.
    #   3. A tenant whose project genuinely needs Xcode 27. That case does NOT
    #      require touching this file: see the per-build override below.
    #
    # HOW TO BUMP SAFELY. Do not flip this value as a convenience. Move one
    # real tenant build to the new version with the override first, confirm
    # the .ipa both uploads AND launches on a device (a green build proves
    # nothing about the UIScene bug), then change the default here and expect
    # to re-run at least one build of every project type build.sh supports.
    # Keep the value QUOTED: unquoted it is a YAML float, harmless for 26.6
    # but a future 26.10 would silently parse as 26.1.
    #
    # PER-BUILD OVERRIDE: this value is the DEFAULT, not a lock. The tenant's
    # project, not ours, decides the right toolchain: an old Flutter/RN may
    # break on a newer Xcode, while an already scene-migrated stack may
    # specifically want 27, and neither should cost a push to this repo.
    # Codemagic's POST /builds accepts environment.softwareVersions.xcode,
    # which overrides the workflow's own setting, so the backend can send a
    # per-project value and simply send nothing to land on this line, which is
    # what every existing tenant does today. Backend side is one optional
    # field on start_build in app/services/builds/codemagic.py plus its call
    # site in app/services/custom/ios_build.py. The CONSTRUCTOR call site
    # (app/services/builds/ios.py) must keep sending nothing: that path builds
    # our own shell and stays non-overridable ON PURPOSE.
    # NOT PROVEN YET: that softwareVersions wins over a value set in the
    # cloned yaml is not spelled out in the docs, only over UI settings. Prove
    # it with one real build before wiring it into the UI or telling tenants
    # it exists. If it loses, the fallback is a workflow input
    # (${{ inputs.xcode }} defaulting to "26.6"), which needs the same
    # one-build proof because input substitution inside the environment block
    # is equally undocumented. Until one of the two is proven, an override is
    # an operator action, not a product feature.
    xcode: "26.6"
    cocoapods: default
    # Node for RN / Expo / Capacitor; Flutter for flutter projects. Both are
    # preinstalled on Codemagic mac images. "node: 22" really does pin a
    # version; "flutter: stable" below does NOT, despite sitting in the same
    # block. See the note directly above it.
    node: 22
    # KNOWN GAP, deliberately NOT addressed by the xcode pin above: "stable"
    # is the same unpinned-upstream risk class that "latest" was, and it moves
    # on its own. Flutter 3.41 made UIScene the default and auto-migrates
    # eligible apps, so a stable bump changes tenant build output without any
    # change here. Pinning it is a separate decision with its own
    # compatibility matrix per tenant Flutter version, not a rider on this one.
    flutter: stable

  scripts: &custom_ios_scripts
    - name: Sanity-check required env-vars
      script: |
        set -e
        # Indirect expansion (${!v}) and the echo below print only the NAME, so
        # listing a secret here cannot leak its value. CERTIFICATE_PRIVATE_KEY
        # belongs in this list because sign.sh hard-fails without it: catching
        # that here costs ten seconds, catching it at the signing step costs the
        # source download, the unpack and the mac minutes in between.
        for v in BUNDLE_ID TEAM_ID \
                 APP_STORE_CONNECT_KEY_IDENTIFIER \
                 APP_STORE_CONNECT_ISSUER_ID \
                 APP_STORE_CONNECT_PRIVATE_KEY \
                 CERTIFICATE_PRIVATE_KEY \
                 REVS_BACKEND_URL REVS_WEBHOOK_TOKEN REVS_BUILD_ID \
                 REVS_SOURCE_URL; do
          if [ -z "${!v}" ]; then
            echo "::error::Missing required env-var: $v"
            exit 1
          fi
        done

    - name: Make scripts executable
      script: chmod +x scripts/*.sh

    - name: Download and unpack the user's project source
      script: ./scripts/download-source.sh

    - name: Fetch App Store Connect signing files (no revoke)
      script: ./scripts/sign.sh

    - name: Build the .ipa
      script: ./scripts/build.sh

  artifacts: &custom_ios_artifacts
    # build.sh normalizes the output into build/ios/ipa/, but Flutter and some
    # native setups drop it elsewhere, so also glob the tree as a fallback.
    # Nothing from the signing step is collected ON PURPOSE. The .p12 lives
    # outside CM_BUILD_DIR, and codemagic-cli-tools' failed-request dumps under
    # /tmp carry the App Store Connect Authorization header, which would become
    # downloadable by anyone with access to the build. Diagnose signing from the
    # build log and the error codes sign.sh emits, never from an artifact.
    - build/ios/ipa/*.ipa
    - "**/*.ipa"
    - /tmp/xcodebuild_logs/*.log

# NOTE: the App Store Connect api_key/key_id/issuer_id trio is spelled out inline
# in each publish workflow below rather than merged from an anchor - Codemagic's
# YAML parser is not guaranteed to support merge keys (<<:), and its publisher
# config validator REQUIRES an explicit key here (it will not fall back to the
# env-vars on its own, even though codemagic-cli-tools reads the same trio for
# signing). The &custom_ios_* anchors above are plain aliases (not merge keys),
# which Codemagic does handle, and every workflow below still consumes all three.

workflows:
  # --- Build only: sign the .ipa and hand it back, never upload. ---------------
  custom-ios:
    name: RevsApp Custom iOS
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment: *custom_ios_env
    scripts: *custom_ios_scripts
    artifacts: *custom_ios_artifacts
    publishing:
      # Runs with `when: always` semantics (post-build), so the backend is always
      # told the outcome and no CustomBuild row is ever stranded 'building'.
      scripts:
        - ./scripts/notify-backend.sh

  # --- Build + upload, WITHOUT beta review: internal testers only. ------------
  # `submit_to_testflight` is omitted on purpose (Codemagic defaults it to
  # false): Apple requires beta review only for EXTERNAL testing, so the upload
  # alone is enough for the tenant's internal testers, and the build never
  # enters the review queue (hence no `expire_build_submitted_for_review`).
  # Build and signing steps are the shared anchors, byte-identical to the other
  # two workflows. This is still TestFlight, not an App Store submission: App
  # Store review submission stays removed from this runner (see header).
  #
  # It is also the only publish variant whose outcome we can fully report. The
  # review submission the EXTERNAL variant performs happens in Apple's
  # asynchronous post-processing, after this machine is gone and with no status
  # reported back, so scripts/notify-backend.sh can confirm the upload but never
  # the submission. This variant has no submission to miss.
  custom-ios-testflight-internal:
    name: RevsApp Custom iOS - TestFlight internal
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment: *custom_ios_env
    scripts: *custom_ios_scripts
    artifacts: *custom_ios_artifacts
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
      scripts:
        - ./scripts/notify-backend.sh

  # --- Build + upload + submit to TestFlight beta review. ----------------------
  custom-ios-testflight:
    name: RevsApp Custom iOS - TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment: *custom_ios_env
    scripts: *custom_ios_scripts
    artifacts: *custom_ios_artifacts
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Upload the .ipa and submit it to TestFlight beta review
        # (post-processing, doesn't consume build minutes).
        submit_to_testflight: true
        expire_build_submitted_for_review: true
      scripts:
        - ./scripts/notify-backend.sh
